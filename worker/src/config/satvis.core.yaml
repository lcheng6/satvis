# Core satvis configuration: the GP groups served by the worker, plus the
# static per-satellite facts attached to their records at refresh time.
#
# Merged with every data/custom/*/satvis.yaml plugin config into
# satvis.generated.json by scripts/generate-groups.mjs at build time.

groups:
  - name: cubesat
    sources: [{ celestrak: cubesat }]
  - name: globalstar
    sources: [{ celestrak: globalstar }]
  - name: gnss
    sources: [{ celestrak: gnss }]
  - name: iridium-NEXT
    sources: [{ celestrak: iridium-NEXT }]
  - name: last-30-days
    sources: [{ celestrak: last-30-days }]
  - name: oneweb
    sources: [{ celestrak: oneweb }]
  - name: planet
    sources: [{ celestrak: planet }]
  - name: resource
    sources: [{ celestrak: resource }]
  - name: science
    sources: [{ celestrak: science }]
  - name: spire
    sources: [{ celestrak: spire }]
  - name: starlink
    sources: [{ celestrak: starlink }]
  - name: stations
    sources: [{ celestrak: stations }]
  - name: weather
    sources: [{ celestrak: weather }]
  - name: eutelsat
    sources: [{ celestrak: eutelsat }]
  # AST SpaceMobile's payloads, across five launches. Sourced by launch
  # (INTDES) plus one CATNR rather than the whole `active` catalog: five small
  # fetches instead of a multi-megabyte one for thirteen satellites. CelesTrak
  # has no group for this operator, so these are plain url sources.
  #
  # CelesTrak supplies the ROSTER (which satellites exist, their names and
  # launch dates); Databricks supplies the ELEMENT SETS actually propagated, at
  # every simulation time including live — see src/modules/elsetSync.ts. That
  # split is deliberate: the warehouse is authoritative for orbital state and
  # holds full SCD2 history, but its satcat dimension went stale on 2026-04-13
  # and so cannot name or date anything launched since.
  #
  # The satellites rows below are what excludes the non-payloads that share
  # these launches: five debris objects on 2024-163 (SPACEMOBILE-00N DEB,
  # 62369-62373) and the LVM3 R/B upper stage on 2025-309 (67233).
  #
  # Names: upstream calls the 2026-139 trio SPACEMOBILE-008/009/010 and the
  # 2026-179 trio SPACEMOBILE-011/012/013 — note 2026-179 runs BACKWARDS, piece
  # A is -013 and piece C is -011. These settle what the request page listed as
  # provisional "BLUEBIRD" numbers. upstreamName is recorded on every row, so an
  # upstream rename or a decay surfaces as a warning in /api/groups.json rather
  # than a silent disappearance.
  #
  # SPACEMOBILE-007 (68765, 2026-085A) is deliberately absent: it launched
  # 2026-04-19 and decayed 2026-04-20, CelesTrak serves no GP record for it
  # ("No GP data found"), and its single Databricks row was never closed — so
  # including it would draw a reentered satellite at every time after launch.
  - name: ast-spacemobile
    sources:
      - { url: "https://celestrak.org/NORAD/elements/gp.php?CATNR=53807&FORMAT=JSON" }
      - { url: "https://celestrak.org/NORAD/elements/gp.php?INTDES=2024-163&FORMAT=JSON" }
      - { url: "https://celestrak.org/NORAD/elements/gp.php?INTDES=2025-309&FORMAT=JSON" }
      - { url: "https://celestrak.org/NORAD/elements/gp.php?INTDES=2026-139&FORMAT=JSON" }
      - { url: "https://celestrak.org/NORAD/elements/gp.php?INTDES=2026-179&FORMAT=JSON" }
    # Satcat twins of the queries above, read only for LAUNCH_DATE. Needed
    # because Databricks' own satcat dimension stops at 2026-04-13, so it
    # carries no launch date for 53807, the 2026-139 trio or the 2026-179 trio —
    # and a CelesTrak element set will otherwise propagate backwards for years
    # before the satellite existed.
    satcatSources:
      - { url: "https://celestrak.org/satcat/records.php?CATNR=53807&FORMAT=JSON" }
      - { url: "https://celestrak.org/satcat/records.php?INTDES=2024-163&FORMAT=JSON" }
      - { url: "https://celestrak.org/satcat/records.php?INTDES=2025-309&FORMAT=JSON" }
      - { url: "https://celestrak.org/satcat/records.php?INTDES=2026-139&FORMAT=JSON" }
      - { url: "https://celestrak.org/satcat/records.php?INTDES=2026-179&FORMAT=JSON" }
    # No launch dates here on purpose: they are data, not configuration. They
    # come from the satcatSources above, and from the Databricks satcat LAUNCH
    # column where it reaches — see the window query in
    # worker/src/databricks/elset.ts.
    satellites:
      # Hyphenated upstream, spaced in the request page — renamed to match.
      - { noradId: 53807, upstreamName: BLUEWALKER-3, name: BLUEWALKER 3 }
      - { noradId: 61047, upstreamName: SPACEMOBILE-001 }
      - { noradId: 61048, upstreamName: SPACEMOBILE-002 }
      - { noradId: 61045, upstreamName: SPACEMOBILE-003 }
      - { noradId: 61049, upstreamName: SPACEMOBILE-004 }
      - { noradId: 61046, upstreamName: SPACEMOBILE-005 }
      - { noradId: 67232, upstreamName: SPACEMOBILE-006 }
      - { noradId: 69589, upstreamName: SPACEMOBILE-008 }
      - { noradId: 69590, upstreamName: SPACEMOBILE-009 }
      - { noradId: 69591, upstreamName: SPACEMOBILE-010 }
      # 2026-179, launched 2026-08-05. Piece A is -013, piece C is -011.
      - { noradId: 100242, upstreamName: SPACEMOBILE-011 }
      - { noradId: 100241, upstreamName: SPACEMOBILE-012 }
      - { noradId: 100240, upstreamName: SPACEMOBILE-013 }

# Static per-satellite facts, matched against a record's NORAD_CAT_ID alone.
# `name` is documentation only — it never takes part in matching.
#
# Swath extents are PER-SIDE cross-track distances (km) from the ground track to
# the swath edge, relative to flight direction (starboard = velocity bearing +
# 90°). They are NOT halves of a full swath width. Sides can differ: Sentinel-3's
# sensor is tilted to avoid sunglint (starboard-heavy in flight).
#
# Provenance: transcribed from an upstream prediction table whose extents were
# cross-checked against published sensor swaths and, where noted, calibrated against
# real product footprints. Entry order and grouping mirror that table, so a re-sync
# stays a readable diff. Only LEO imagers appear here — geostationary weather
# platforms have no moving ground-track swath.
#
# Satellites absent from this table fall back to the app defaults (see
# src/config/satelliteMetadata.ts).
satellites:
  # --- MODIS (Terra/Aqua) — 2330 km nominal; footprints reach ~1170/side ---
  - { noradId: 25994, name: TERRA, swathStarboardKm: 1175, swathPortKm: 1175 }
  - { noradId: 27424, name: AQUA, swathStarboardKm: 1175, swathPortKm: 1175 }

  # --- VIIRS (JPSS) — 3040 km nominal; L1 footprints reach ~1556/side ---
  - { noradId: 37849, name: SUOMI NPP, swathStarboardKm: 1565, swathPortKm: 1565 }
  - { noradId: 43013, name: NOAA 20 (JPSS-1), swathStarboardKm: 1565, swathPortKm: 1565 }
  - { noradId: 54234, name: NOAA 21 (JPSS-2), swathStarboardKm: 1565, swathPortKm: 1565 }

  # --- MSI (Sentinel-2) — 290 km nominal; L1C tiles reach ~149/side ---
  - { noradId: 40697, name: SENTINEL-2A, swathStarboardKm: 150, swathPortKm: 150 }
  - { noradId: 42063, name: SENTINEL-2B, swathStarboardKm: 150, swathPortKm: 150 }
  - { noradId: 60989, name: SENTINEL-2C, swathStarboardKm: 150, swathPortKm: 150 }

  # --- SLSTR (Sentinel-3) — tilted against sunglint, so the sides differ ---
  # Side assignment verified empirically against real SLSTR granule footprints:
  # the tilt points the sensor WEST on the descending day pass, i.e. starboard.
  # Observed reach 995-998 / 499-502 km.
  - { noradId: 41335, name: SENTINEL-3A, swathStarboardKm: 1000, swathPortKm: 500 }
  - { noradId: 43437, name: SENTINEL-3B, swathStarboardKm: 1000, swathPortKm: 500 }

  # --- TROPOMI (Sentinel-5P) — 2600 km nominal, nadir-pointing (no tilt,
  #     unlike Sentinel-3); NRTI footprints reach ~1366 both sides ---
  - { noradId: 42969, name: SENTINEL-5P, swathStarboardKm: 1375, swathPortKm: 1375 }

  # --- OLI (Landsat) — 185 km total ---
  - { noradId: 39084, name: LANDSAT 8, swathStarboardKm: 92.5, swathPortKm: 92.5 }
  - { noradId: 49260, name: LANDSAT 9, swathStarboardKm: 92.5, swathPortKm: 92.5 }

  # --- AVHRR/3 (MetOp) — 2900 km total ---
  - { noradId: 38771, name: METOP-B, swathStarboardKm: 1450, swathPortKm: 1450 }
  - { noradId: 43689, name: METOP-C, swathStarboardKm: 1450, swathPortKm: 1450 }

  # --- MERSI (Fengyun-3) — 2900 km total ---
  # Only the satellites carrying a confirmed MERSI variant are listed; the older
  # Fengyun 3A/3B/3C and the newer 3G/3H are deliberately absent (see ADR-0002).
  - { noradId: 43010, name: FENGYUN 3D, swathStarboardKm: 1450, swathPortKm: 1450 }
  - { noradId: 49008, name: FENGYUN 3E, swathStarboardKm: 1450, swathPortKm: 1450 }
  - { noradId: 57490, name: FENGYUN 3F, swathStarboardKm: 1450, swathPortKm: 1450 }

  # --- SGLI (GCOM-C) — 1150 km total ---
  - { noradId: 43065, name: GCOM-C (SHIKISAI), swathStarboardKm: 575, swathPortKm: 575 }
